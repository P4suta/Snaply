name: Extended checks

on:
  workflow_call:
    inputs:
      sha:
        description: Validated release commit SHA
        required: true
        type: string
      publisher:
        description: Validated MSIX package publisher
        required: true
        type: string
  workflow_dispatch:

concurrency:
  group: snaply-extended-${{ inputs.sha || github.sha }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "1"
  TESTINGPLATFORM_TELEMETRY_OPTOUT: "1"

jobs:
  publisher-proof:
    name: publisher-proof
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4
        with:
          version: 2026.10.19
          install_args: rust cargo:kani-verifier
      - run: mise x -- cargo kani setup
      - run: mise run publisher-proof

  native:
    name: native-${{ matrix.architecture }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: x64
            platform: x64
            rid: win-x64
            runner: windows-latest
          - architecture: arm64
            platform: ARM64
            rid: win-arm64
            runner: windows-11-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    defaults:
      run:
        shell: pwsh
    env:
      PLATFORM: ${{ matrix.platform }}
      RID: ${{ matrix.rid }}
      ARCHITECTURE: ${{ matrix.architecture }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
          architecture: ${{ matrix.architecture }}
          cache: true
          cache-dependency-path: "**/packages.lock.json"
      - uses: microsoft/setup-WinAppCli@b93bbddc1f7abc061ca0d3a8119e3a0c7dd71495
        with:
          version: v0.3.1
      - run: dotnet restore Snaply.slnx --locked-mode
      - run: >-
          dotnet restore tests/Snaply.App.Tests/Snaply.App.Tests.csproj
          --locked-mode
          -p:Configuration=Release
          -p:Platform=$env:PLATFORM
      - run: dotnet test --project tests/Snaply.Tests/Snaply.Tests.csproj -c Release --no-restore
      - run: >-
          dotnet test --project tests/Snaply.App.Tests/Snaply.App.Tests.csproj
          -c Release
          -p:Platform=$env:PLATFORM
          --no-restore
      - name: Publish native portable payload
        run: >-
          dotnet publish src/Snaply.App/Snaply.App.csproj
          -c Release
          -r $env:RID
          -p:Platform=$env:PLATFORM
          -p:WindowsPackageType=None
          --self-contained true
          -o build/native
          --no-restore
      - name: Run the UI journeys
        shell: pwsh
        run: |
          1..1 | ForEach-Object {
            $process = Start-Process build/native/Snaply.exe -PassThru
            try {
              ./src/Snaply.App/ui-tests.ps1 `
                -AppPid $process.Id `
                -Architecture $env:ARCHITECTURE
              if ($LASTEXITCODE -ne 0) { throw "UI pass $_ failed." }
            }
            finally {
              $null = $process.CloseMainWindow()
              if (-not $process.WaitForExit(5000)) {
                Stop-Process -Id $process.Id -Force
              }
            }
          }
      - name: Run 100-capture soak
        shell: pwsh
        run: |
          $process = Start-Process build/native/Snaply.exe -PassThru
          try {
            ./src/Snaply.App/ui-tests.ps1 `
              -AppPid $process.Id `
              -Architecture $env:ARCHITECTURE `
              -SoakIterations 100
            if ($LASTEXITCODE -ne 0) { throw "Soak failed." }
            if (@(Get-NetTCPConnection -OwningProcess $process.Id -ErrorAction SilentlyContinue).Count) {
              throw "Snaply opened a TCP socket."
            }
          }
          finally {
            $null = $process.CloseMainWindow()
            if (-not $process.WaitForExit(5000)) {
              Stop-Process -Id $process.Id -Force
            }
          }
      - name: Collect app logs
        if: always()
        shell: pwsh
        run: |
          $logs = Join-Path $env:LOCALAPPDATA 'Snaply\Logs'
          # An empty folder is dropped by upload-artifact, so say out loud which case
          # this is: no folder means the app never got as far as configuring logging,
          # an empty one means it ran and logged nothing.
          if (-not (Test-Path $logs)) {
            Write-Host "No log directory at $logs."
            exit 0
          }
          $files = @(Get-ChildItem $logs -File)
          Write-Host "Log directory holds $($files.Count) file(s)."
          foreach ($file in $files) {
            Write-Host "--- $($file.Name) ---"
            Get-Content $file.FullName | Write-Host
          }
          New-Item -ItemType Directory -Force -Path artifacts/ui/app-logs | Out-Null
          Copy-Item "$logs\*" artifacts/ui/app-logs -Recurse -Force
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: ui-${{ matrix.architecture }}
          path: artifacts/ui
          retention-days: 7
          if-no-files-found: warn
  mutation:
    name: mutation
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: "**/packages.lock.json"
      - run: dotnet restore tests/Snaply.Tests/Snaply.Tests.csproj --locked-mode
      - run: dotnet tool install --tool-path build/tools dotnet-stryker --version 4.16.0
      - name: Mutation test Imaging
        working-directory: tests/Snaply.Tests
        run: >-
          ../../build/tools/dotnet-stryker
          --test-runner mtp
          --break-at 85
          --reporter progress
          --reporter html
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: mutation-report
          path: tests/Snaply.Tests/StrykerOutput/**/reports/mutation-report.html
          retention-days: 7
          if-no-files-found: error

  reproducibility:
    name: reproducibility
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: "**/packages.lock.json"
      - name: Build twice
        shell: pwsh
        env:
          MSIX_PUBLISHER: ${{ inputs.publisher || 'CN=Snaply' }}
        run: |
          $version = (Get-Content version.txt -Raw).Trim()
          ./scripts/test-reproducibility.ps1 -Version $version -Publisher $env:MSIX_PUBLISHER
