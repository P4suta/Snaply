name: release

on:
  workflow_dispatch:
    inputs:
      tag_name:
        description: Version tag such as v1.2.3
        required: true
        type: string
      sha:
        description: Full release commit SHA
        required: true
        type: string
      publish:
        description: Publish after every gate passes
        required: true
        default: false
        type: boolean

concurrency:
  group: release-${{ inputs.tag_name }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "1"
  TESTINGPLATFORM_TELEMETRY_OPTOUT: "1"
  REF: ${{ inputs.sha }}

jobs:
  build:
    name: build
    runs-on: windows-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Validate release inputs
        shell: pwsh
        env:
          TAG: ${{ inputs.tag_name }}
          SHA: ${{ inputs.sha }}
          MSIX_PUBLISHER: ${{ vars.MSIX_PUBLISHER }}
          CONTROLLER_REF: ${{ github.ref }}
        run: |
          if ($env:CONTROLLER_REF -ne 'refs/heads/main') {
            throw "The release controller must run from main."
          }
          if ($env:TAG -notmatch '^v\d+\.\d+\.\d+$') {
            throw "tag_name must be vMAJOR.MINOR.PATCH."
          }
          if ($env:SHA -notmatch '^[0-9a-f]{40}$') {
            throw "sha must be a full lowercase commit SHA."
          }
          if ([string]::IsNullOrWhiteSpace($env:MSIX_PUBLISHER)) {
            throw "The MSIX_PUBLISHER repository variable is required."
          }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.REF }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify release tag and commit
        shell: pwsh
        env:
          TAG: ${{ inputs.tag_name }}
          SHA: ${{ inputs.sha }}
        run: |
          $head = (git rev-parse HEAD).Trim()
          if ($LASTEXITCODE -ne 0 -or $head -ne $env:SHA) {
            throw "The checked-out commit does not match sha."
          }
          $tagCommit = (git rev-parse "refs/tags/$env:TAG^{commit}").Trim()
          if ($LASTEXITCODE -ne 0 -or $tagCommit -ne $head) {
            throw "The release tag does not identify sha."
          }
          git merge-base --is-ancestor $head origin/main
          if ($LASTEXITCODE -ne 0) {
            throw "The release commit is not in main."
          }
          $version = (Get-Content version.txt -Raw).Trim()
          if ("v$version" -ne $env:TAG) {
            throw "The release tag does not match the project version."
          }
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x
          global-json-file: global.json
          cache: true
          cache-dependency-path: "**/packages.lock.json"
      - name: Build unsigned release payloads
        shell: pwsh
        env:
          MSIX_PUBLISHER: ${{ vars.MSIX_PUBLISHER }}
          TAG: ${{ inputs.tag_name }}
        run: |
          $version = $env:TAG.TrimStart('v')
          ./scripts/release.ps1 -Action Build -Version $version `
            -Publisher $env:MSIX_PUBLISHER
      - name: Generate SPDX SBOM
        shell: pwsh
        env:
          TAG: ${{ inputs.tag_name }}
        run: |
          dotnet tool restore
          dotnet tool run sbom-tool -- generate `
            -b build/release `
            -bc . `
            -pn Snaply `
            -pv $env:TAG.TrimStart('v') `
            -ps P4suta `
            -nsb https://github.com/P4suta/Snaply `
            -mi SPDX:2.2 `
            -cd '--DirectoryExclusionList **/artifacts/** --DirectoryExclusionList **/build/**'
      - uses: taiki-e/install-action@a4d3f3f761dcd95cce1b72cb61cb6d1963438177 # v2.87.30
        with:
          tool: osv-scanner@2.3.6
      - name: Scan release SBOM
        run: >-
          osv-scanner scan source
          -L build/release/_manifest/spdx_2.2/manifest.spdx.json
          --config osv-scanner.toml
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: unsigned-release
          path: build/release
          retention-days: 1
          if-no-files-found: error

  extended-checks:
    needs: build
    uses: $/.github/workflows/nightly.yml
    with:
      sha: ${{ inputs.sha }}
      publisher: ${{ vars.MSIX_PUBLISHER }}

  sign:
    name: sign
    needs: [build, extended-checks]
    runs-on: windows-latest
    timeout-minutes: 25
    environment: release
    permissions:
      id-token: write # Authenticate to Doppler for signing credentials.
      contents: read
    env:
      HAVE_SIGNING: ${{ vars.DOPPLER_SIGN_WINDOWS_IDENTITY_ID != '' }}
      SIGNER_SUBJECT_CONTAINS: ${{ vars.SIGNER_SUBJECT_CONTAINS }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.REF }}
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: "**/packages.lock.json"
      - run: dotnet restore src/Snaply.App/Snaply.App.csproj --locked-mode
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: unsigned-release
          path: build/release
      - name: Require production signing configuration
        shell: pwsh
        run: |
          if ($env:HAVE_SIGNING -ne 'true') {
            throw "All SSL.com eSigner secrets are required."
          }
          if ([string]::IsNullOrWhiteSpace($env:SIGNER_SUBJECT_CONTAINS)) {
            throw "SIGNER_SUBJECT_CONTAINS is required."
          }
      - name: Fetch sign_windows credentials
        id: doppler_sign_windows_5
        uses: dopplerhq/secrets-fetch-action@451892f16195f9ac360e1a5bcbf0b5fd0e957534
        with:
          auth-method: oidc
          doppler-identity-id: ${{ vars.DOPPLER_SIGN_WINDOWS_IDENTITY_ID }}
          doppler-project: snaply
          doppler-config: sign_windows
          inject-env-vars: false
      - name: Reject missing or unresolved sign_windows credentials
        if: >-
          ${{ steps.doppler_sign_windows_5.outcome == 'success' && (
          steps.doppler_sign_windows_5.outputs.SSLDOTCOM_CREDENTIAL_ID == '' ||
          startsWith(steps.doppler_sign_windows_5.outputs.SSLDOTCOM_CREDENTIAL_ID, '${') ||
          steps.doppler_sign_windows_5.outputs.SSLDOTCOM_PASSWORD == '' ||
          startsWith(steps.doppler_sign_windows_5.outputs.SSLDOTCOM_PASSWORD, '${') ||
          steps.doppler_sign_windows_5.outputs.SSLDOTCOM_TOTP_SECRET == '' ||
          startsWith(steps.doppler_sign_windows_5.outputs.SSLDOTCOM_TOTP_SECRET, '${') ||
          steps.doppler_sign_windows_5.outputs.SSLDOTCOM_USERNAME == '' ||
          startsWith(steps.doppler_sign_windows_5.outputs.SSLDOTCOM_USERNAME, '${')
          ) }}
        shell: bash
        run: exit 1

      - name: Sign portable first-party binaries
        uses: SSLcom/esigner-codesign@cf5f6c1d38ad10f47e3ed9aca873f429b1a8d85b # v1.3.2
        with:
          command: batch_sign
          username: ${{ steps.doppler_sign_windows_5.outputs.SSLDOTCOM_USERNAME }}
          password: ${{ steps.doppler_sign_windows_5.outputs.SSLDOTCOM_PASSWORD }}
          credential_id: ${{ steps.doppler_sign_windows_5.outputs.SSLDOTCOM_CREDENTIAL_ID }}
          totp_secret: ${{ steps.doppler_sign_windows_5.outputs.SSLDOTCOM_TOTP_SECRET }}
          dir_path: ${{ github.workspace }}\build\release\sign-stage\portable
          output_path: ${{ github.workspace }}\build\release\signed\portable
          environment_name: PROD
          malware_block: "true"
      - name: Fetch sign_windows credentials
        id: doppler_sign_windows_6
        uses: dopplerhq/secrets-fetch-action@451892f16195f9ac360e1a5bcbf0b5fd0e957534
        with:
          auth-method: oidc
          doppler-identity-id: ${{ vars.DOPPLER_SIGN_WINDOWS_IDENTITY_ID }}
          doppler-project: snaply
          doppler-config: sign_windows
          inject-env-vars: false
      - name: Reject missing or unresolved sign_windows credentials
        if: >-
          ${{ steps.doppler_sign_windows_6.outcome == 'success' && (
          steps.doppler_sign_windows_6.outputs.SSLDOTCOM_CREDENTIAL_ID == '' ||
          startsWith(steps.doppler_sign_windows_6.outputs.SSLDOTCOM_CREDENTIAL_ID, '${') ||
          steps.doppler_sign_windows_6.outputs.SSLDOTCOM_PASSWORD == '' ||
          startsWith(steps.doppler_sign_windows_6.outputs.SSLDOTCOM_PASSWORD, '${') ||
          steps.doppler_sign_windows_6.outputs.SSLDOTCOM_TOTP_SECRET == '' ||
          startsWith(steps.doppler_sign_windows_6.outputs.SSLDOTCOM_TOTP_SECRET, '${') ||
          steps.doppler_sign_windows_6.outputs.SSLDOTCOM_USERNAME == '' ||
          startsWith(steps.doppler_sign_windows_6.outputs.SSLDOTCOM_USERNAME, '${')
          ) }}
        shell: bash
        run: exit 1

      - name: Sign MSIX bundle
        uses: SSLcom/esigner-codesign@cf5f6c1d38ad10f47e3ed9aca873f429b1a8d85b # v1.3.2
        with:
          command: batch_sign
          username: ${{ steps.doppler_sign_windows_6.outputs.SSLDOTCOM_USERNAME }}
          password: ${{ steps.doppler_sign_windows_6.outputs.SSLDOTCOM_PASSWORD }}
          credential_id: ${{ steps.doppler_sign_windows_6.outputs.SSLDOTCOM_CREDENTIAL_ID }}
          totp_secret: ${{ steps.doppler_sign_windows_6.outputs.SSLDOTCOM_TOTP_SECRET }}
          dir_path: ${{ github.workspace }}\build\release\sign-stage\msix
          output_path: ${{ github.workspace }}\build\release\signed\msix
          environment_name: PROD
          malware_block: "true"
      - name: Collect and verify signed payloads
        shell: pwsh
        env:
          TAG: ${{ inputs.tag_name }}
        run: |
          $version = $env:TAG.TrimStart('v')
          ./scripts/release.ps1 -Action Collect -Version $version
          ./scripts/release.ps1 -Action Verify -Version $version `
            -SignerSubjectContains $env:SIGNER_SUBJECT_CONTAINS
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: signed-release
          path: build/release
          retention-days: 1
          if-no-files-found: error

  wack:
    name: wack
    needs: sign
    runs-on: windows-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: signed-release
          path: build/release
      - name: Run Windows App Certification Kit
        shell: pwsh
        run: |
          $appcert = Get-ChildItem `
            "${env:ProgramFiles(x86)}\Windows Kits\10\App Certification Kit" `
            -Filter appcert.exe -File -ErrorAction Stop |
            Select-Object -First 1
          $bundle = Get-ChildItem build/release/msix -Filter *.msixbundle -File |
            Select-Object -First 1
          & $appcert.FullName reset
          if ($LASTEXITCODE -ne 0) { throw "WACK reset failed." }
          & $appcert.FullName test -appxpackagepath $bundle.FullName `
            -reportoutputpath "$pwd\build\wack-report.xml"
          if ($LASTEXITCODE -ne 0) { throw "WACK failed." }
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: wack-report
          path: build/wack-report.xml
          if-no-files-found: error

  qa:
    needs: sign
    name: qa-${{ matrix.architecture }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: x64
            runner: windows-latest
          - architecture: arm64
            runner: windows-11-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.REF }}
          persist-credentials: false
      - uses: microsoft/setup-WinAppCli@b93bbddc1f7abc061ca0d3a8119e3a0c7dd71495
        with:
          version: v0.3.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: signed-release
          path: build/release
      - name: Download previous MSIX for upgrade testing
        id: previous
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          New-Item -ItemType Directory -Path build/previous -Force | Out-Null
          gh release download --pattern '*.msixbundle' --dir build/previous
          if ($LASTEXITCODE -eq 0) {
            $previous = Get-ChildItem build/previous -Filter *.msixbundle -File |
              Select-Object -First 1
            "path=$($previous.FullName)" >> $env:GITHUB_OUTPUT
          } else {
            "path=" >> $env:GITHUB_OUTPUT
          }
      - name: Test portable and MSIX release artifacts
        shell: pwsh
        env:
          ARCHITECTURE: ${{ matrix.architecture }}
          PREVIOUS_MSIX_BUNDLE: ${{ steps.previous.outputs.path }}
        run: |
          ./scripts/release-qa.ps1 `
            -ReleaseRoot build/release `
            -Architecture $env:ARCHITECTURE `
            -PreviousMsixBundle $env:PREVIOUS_MSIX_BUNDLE
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: release-qa-${{ matrix.architecture }}
          path: artifacts/ui
          if-no-files-found: error

  publisher-build:
    name: publisher-build
    needs: build
    if: ${{ inputs.publish }}
    runs-on: windows-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4
        with:
          version: 2026.10.19
          install_args: rust gh cargo:cargo-audit
      - name: Verify the controller publisher on Windows
        run: mise run publisher-check
      - name: Audit publisher dependencies against the pinned advisory snapshot
        run: mise run publisher-audit
      - name: Build trusted release publisher
        run: mise x -- cargo build --locked --release --manifest-path tools/release-publisher/Cargo.toml
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: trusted-release-publisher
          path: tools/release-publisher/target/release/snaply-release-publisher.exe
          retention-days: 1
          if-no-files-found: error

  package:
    name: package
    needs: [sign, wack, qa]
    if: ${{ inputs.publish }}
    runs-on: windows-latest
    timeout-minutes: 25
    environment: release
    permissions:
      contents: read
    env:
      SIGNER_SUBJECT_CONTAINS: ${{ vars.SIGNER_SUBJECT_CONTAINS }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.REF }}
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x
          global-json-file: global.json
      - run: dotnet restore src/Snaply.App/Snaply.App.csproj --locked-mode
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: signed-release
          path: build/release
      - name: Re-verify and package signed artifacts
        shell: pwsh
        env:
          TAG: ${{ inputs.tag_name }}
        run: |
          $version = $env:TAG.TrimStart('v')
          ./scripts/release.ps1 -Action Verify -Version $version `
            -SignerSubjectContains $env:SIGNER_SUBJECT_CONTAINS
          ./scripts/release.ps1 -Action Package -Version $version
      - name: Reject portable size growth over 10 percent
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          New-Item -ItemType Directory -Path build/previous-size -Force | Out-Null
          gh release download --pattern 'snaply-*-win-*.zip' --dir build/previous-size
          if ($LASTEXITCODE -ne 0) {
            Write-Host "No previous portable release; size baseline starts here."
            exit 0
          }
          foreach ($architecture in @('x64', 'arm64')) {
            $old = Get-ChildItem build/previous-size -Filter "*-win-$architecture.zip" |
              Select-Object -First 1
            $new = Get-ChildItem build/release/package -Filter "*-win-$architecture.zip" |
              Select-Object -First 1
            if ($old -and $new -and $new.Length -gt ($old.Length * 1.10)) {
              throw "$architecture package grew by more than 10%."
            }
          }
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-package
          path: build/release/package
          retention-days: 1
          if-no-files-found: error

  publish:
    name: publish
    needs: [package, publisher-build]
    if: ${{ inputs.publish }}
    runs-on: windows-latest
    timeout-minutes: 25
    environment: release
    permissions:
      contents: write # Upload the verified release assets.
      id-token: write # Authenticate the provenance and SBOM attestations.
      attestations: write # Record the release attestations.
      artifact-metadata: write # Attach release artifact metadata to attestations.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4
        with:
          version: 2026.10.19
          install_args: gh
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: trusted-release-publisher
          path: build/publisher
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-package
          path: build/release/package
      - name: Attest build provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            build/release/package/*.zip
            build/release/package/*.msixbundle
            build/release/package/SHA256SUMS.txt
      - name: Attest SBOM
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            build/release/package/*.zip
            build/release/package/*.msixbundle
          sbom-path: build/release/package/snaply.spdx.json
      - name: Publish release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          TAG: ${{ inputs.tag_name }}
          SHA: ${{ inputs.sha }}
        run: >-
          mise x -- build/publisher/snaply-release-publisher.exe
          --repo $env:REPOSITORY --tag $env:TAG --sha $env:SHA
          --assets build/release/package --apply
