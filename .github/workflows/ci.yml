name: CI

on:
  merge_group:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "1"
  TESTINGPLATFORM_TELEMETRY_OPTOUT: "1"

jobs:
  hygiene:
    name: hygiene
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4
        with:
          version: 2026.10.19
          install_args: rust gh github:kjanat/actionlint
      - name: Validate workflows
        run: mise x -- actionlint
      - uses: crate-ci/typos@7f9d0819ca1c008ade73f4b41fa9d258d48f605b # v1.51.1
      - uses: fsfe/reuse-action@676e2d560c9a403aa252096d99fcab3e1132b0f5 # v6
      - name: Verify release publisher
        run: mise run publisher-check
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: "**/packages.lock.json"
      - name: Verify restores for Renovate on Linux
        run: dotnet restore Snaply.slnx --locked-mode
      - name: Reject incomplete implementation markers
        shell: bash
        run: |
          if rg -n 'TODO|FIXME|HACK|NotImplementedException' src tests scripts; then
            echo "::error::incomplete implementation marker found"
            exit 1
          fi

  quality:
    name: quality
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: "**/packages.lock.json"
      - name: Verify source, tests, coverage, and portable publishes
        shell: pwsh
        run: ./scripts/verify.ps1

  packaging:
    name: packaging
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x
          global-json-file: global.json
          cache: true
          cache-dependency-path: "**/packages.lock.json"
      - name: Build and validate unsigned release payloads
        shell: pwsh
        run: |
          $version = (Get-Content version.txt -Raw).Trim()
          ./scripts/release.ps1 `
            -Action Build `
            -Version $version `
            -Publisher CN=Snaply `
            -OutputRoot build/package-smoke
          ./scripts/release.ps1 `
            -Action Package `
            -Version $version `
            -OutputRoot build/package-smoke

  # Aggregate gate the branch protection requires (context "ci-required"): green only
  # when every CI job above succeeded. Keeps the required-checks list stable as jobs change.
  ci-required:
    name: ci-required
    needs: [hygiene, quality, packaging]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require all CI jobs to succeed
        env:
          INCOMPLETE: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped') }}
        run: |
          if [ "$INCOMPLETE" = "true" ]; then
            echo "::error::a required CI job did not succeed"
            exit 1
          fi
          echo "all required CI jobs passed"

  # The one status check branch protection requires,
  # named the same in every P4suta repository.
  # It passes only when every job it needs succeeded or was skipped.
  required:
    name: required
    if: always()
    needs: [ci-required]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Fail unless every needed job succeeded or was skipped
        env:
          RESULTS: ${{ toJSON(needs.*.result) }}
        run: |
          echo "${RESULTS}"
          jq -e 'all(.[]; IN("success", "skipped"))' <<< "${RESULTS}"
