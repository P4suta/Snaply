name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "1"
  TESTINGPLATFORM_TELEMETRY_OPTOUT: "1"

jobs:
  hygiene:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: raven-actions/actionlint@3d39aea434753780c3b3d4a1a31c854b4dbf49d7 # v2.2.0
      - uses: crate-ci/typos@d43b6c087ac471e2ea7b8af622ff15f05c0c365b # v1.47.2
      - uses: fsfe/reuse-action@676e2d560c9a403aa252096d99fcab3e1132b0f5 # v6
      - name: Reject incomplete implementation markers
        shell: bash
        run: |
          if rg -n 'TODO|FIXME|HACK|NotImplementedException' src tests scripts; then
            echo "::error::incomplete implementation marker found"
            exit 1
          fi

  quality:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: "**/packages.lock.json"
      - name: Verify source, tests, coverage, and portable publishes
        shell: pwsh
        run: ./scripts/verify.ps1

  packaging:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 8.0.x
          global-json-file: global.json
          cache: true
          cache-dependency-path: "**/packages.lock.json"
      - name: Build and validate unsigned release payloads
        shell: pwsh
        run: |
          $version = (Get-Content version.txt -Raw).Trim()
          ./scripts/release.ps1 `
            -Action Build `
            -Version $version `
            -Publisher CN=Snaply `
            -OutputRoot build/package-smoke
          ./scripts/release.ps1 `
            -Action Package `
            -Version $version `
            -OutputRoot build/package-smoke

  # Aggregate gate the branch protection requires (context "ci-required"): green only
  # when every CI job above succeeded. Keeps the required-checks list stable as jobs change.
  ci-required:
    needs: [hygiene, quality, packaging]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require all CI jobs to succeed
        run: |
          if [ "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped') }}" = "true" ]; then
            echo "::error::a required CI job did not succeed"
            exit 1
          fi
          echo "all required CI jobs passed"
