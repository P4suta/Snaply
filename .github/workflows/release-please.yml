name: release-please

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release-please
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release-please:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: release-please
    permissions:
      id-token: write
      actions: write
      contents: write
      pull-requests: write
    env:
      HAS_APP: ${{ vars.DOPPLER_AUTOMATION_IDENTITY_ID != '' }}
    steps:
      - name: Require GitHub App configuration for manual runs
        if: ${{ github.event_name == 'workflow_dispatch' && env.HAS_APP != 'true' }}
        run: |
          echo "::error::release-please GitHub App credentials are not configured"
          exit 1
      - name: Fetch automation credentials
        id: doppler_automation_1
        if: "env.HAS_APP == 'true'"
        uses: dopplerhq/secrets-fetch-action@451892f16195f9ac360e1a5bcbf0b5fd0e957534
        with:
          auth-method: oidc
          doppler-identity-id: ${{ vars.DOPPLER_AUTOMATION_IDENTITY_ID }}
          doppler-project: snaply
          doppler-config: automation
          inject-env-vars: false
      - name: Reject missing or unresolved automation credentials
        if: >-
          ${{ steps.doppler_automation_1.outcome == 'success' && (
          steps.doppler_automation_1.outputs.GITHUB_APP_CLIENT_ID == '' ||
          startsWith(steps.doppler_automation_1.outputs.GITHUB_APP_CLIENT_ID, '${') ||
          steps.doppler_automation_1.outputs.GITHUB_APP_PRIVATE_KEY == '' ||
          startsWith(steps.doppler_automation_1.outputs.GITHUB_APP_PRIVATE_KEY, '${')
          ) }}
        shell: bash
        run: exit 1

      - name: Mint GitHub App token
        id: app-token
        if: env.HAS_APP == 'true'
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ steps.doppler_automation_1.outputs.GITHUB_APP_CLIENT_ID }}
          private-key: ${{ steps.doppler_automation_1.outputs.GITHUB_APP_PRIVATE_KEY }}
      - name: Update release pull request
        id: release
        if: env.HAS_APP == 'true'
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ steps.app-token.outputs.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
      - name: Start protected release build
        if: ${{ env.HAS_APP == 'true' && steps.release.outputs.release_created == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          TAG: ${{ steps.release.outputs.tag_name }}
          SHA: ${{ steps.release.outputs.sha }}
        run: >-
          gh workflow run release.yml
          --repo "$REPOSITORY"
          --ref main
          -f tag_name="$TAG"
          -f sha="$SHA"
          -f publish=true
      - name: Report dormant integration
        if: ${{ github.event_name != 'workflow_dispatch' && env.HAS_APP != 'true' }}
        run: echo "::notice::release-please is dormant until its GitHub App credentials are configured"
