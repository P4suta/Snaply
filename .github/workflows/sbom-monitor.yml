name: sbom-monitor

on:
  # Recheck immutable release contents for advisories disclosed after publication.
  schedule:
    - cron: "7 5 * * 1"
  workflow_dispatch:

concurrency:
  group: sbom-monitor-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  rescan:
    name: Rescan shipped SBOM
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Read release assets and open an issue only when the scan finds a vulnerability.
    permissions:
      contents: read
      issues: write # Open an issue when the published artifact scan finds a vulnerability.
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Download published release SBOM
        id: release
        shell: bash
        run: |
          if ! release_count=$(gh release list \
            --limit 1 --exclude-drafts --exclude-pre-releases \
            --json tagName --jq 'length'); then
            echo "::error::Could not check for a published release."
            exit 1
          fi
          if [[ "$release_count" == "0" ]]; then
            echo "available=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if ! tag=$(gh release view --json tagName --jq .tagName); then
            echo "::error::Could not resolve the latest published release."
            exit 1
          fi
          sbom=$(gh release view "$tag" --json assets --jq 'if any(.assets[]; .name == "snaply.spdx.json") then "snaply.spdx.json" elif any(.assets[]; .name == "snaply.cdx.json") then "snaply.cdx.json" else "" end')
          if [[ -z "$sbom" ]]; then
            echo "::error::Release $tag has no supported SBOM asset."
            exit 1
          fi
          mkdir -p sbom
          gh release download "$tag" --pattern "$sbom" --dir sbom
          {
            echo "available=true"
            echo "tag=$tag"
            echo "sbom=$sbom"
          } >> "$GITHUB_OUTPUT"
      - uses: taiki-e/install-action@a4d3f3f761dcd95cce1b72cb61cb6d1963438177 # v2.87.30
        if: steps.release.outputs.available == 'true'
        with:
          tool: osv-scanner@2.3.6
      - name: Scan shipped SBOM
        id: scan
        if: steps.release.outputs.available == 'true'
        env:
          SBOM_NAME: ${{ steps.release.outputs.sbom }}
        shell: bash
        run: |
          code=0
          osv-scanner scan source -L "sbom/$SBOM_NAME" \
            --config osv-scanner.toml --format markdown \
            --output osv-report.md || code=$?
          if [[ "$code" != "0" && "$code" != "1" ]]; then
            echo "::error::OSV-Scanner failed with exit code $code."
            exit "$code"
          fi
          echo "code=$code" >> "$GITHUB_OUTPUT"
      - name: Open vulnerability issue
        if: steps.scan.outputs.code == '1'
        shell: bash
        env:
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          run_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          body=$(printf 'The shipped SBOM for %s failed the current OSV scan.\n\n%s' \
            "$TAG" "$run_url")
          gh issue create --title "Vulnerability in shipped release $TAG" --body "$body"
      - name: Enforce scan result
        if: steps.scan.outputs.code == '1'
        run: exit 1
